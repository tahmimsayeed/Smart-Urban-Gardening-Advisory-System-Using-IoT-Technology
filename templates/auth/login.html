{% extends "base.html" %}
{% block title %}Log In &mdash; Smart Urban Gardening{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
          <h1 class="h3 mb-1 text-success"><i class="bi bi-box-arrow-in-right me-2"></i>Log In</h1>
          <p class="text-muted mb-4">Welcome back to your garden dashboard.</p>

          <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required autofocus>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="form-check mb-3">
              <input type="checkbox" class="form-check-input" id="remember" name="remember">
              <label class="form-check-label" for="remember">Keep me logged in</label>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2">Log In</button>
          </form>

          <p class="text-center text-muted mt-4 mb-0">
            Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-success text-decoration-none fw-semibold">Register</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
