{% extends "base.html" %}
{% block title %}Edit {{ plant.name }} &mdash; Smart Urban Gardening{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-7 col-lg-6">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
          <h1 class="h3 mb-1 text-success"><i class="bi bi-pencil-square me-2"></i>Edit Plant</h1>
          <p class="text-muted mb-4">Update details for {{ plant.name }}.</p>

          <form method="POST" action="{{ url_for('plants.edit_plant', plant_id=plant.plantId) }}" novalidate>
            <div class="mb-3">
              <label for="name" class="form-label">Plant name</label>
              <input type="text" class="form-control" id="name" name="name"
                     value="{{ name if name is defined else plant.name }}" required autofocus>
            </div>

            <div class="mb-3">
              <label for="type" class="form-label">Type</label>
              <input type="text" class="form-control" id="type" name="type"
                     value="{{ type if type is defined else plant.type }}" required>
            </div>

            <div class="mb-4">
              <label for="location" class="form-label">Location <span class="text-muted">(optional)</span></label>
              <input type="text" class="form-control" id="location" name="location"
                     value="{{ location if location is defined else (plant.location or '') }}">
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-success flex-grow-1"><i class="bi bi-check-lg me-1"></i>Save Changes</button>
              <a href="{{ url_for('plants.view_plant', plant_id=plant.plantId) }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
